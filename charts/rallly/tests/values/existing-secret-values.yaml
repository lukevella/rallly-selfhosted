# GitOps path: every secret sourced from a pre-existing Secret, bundled
# Postgres/Garage enabled. Exercises the required existingSecret contract
# that ArgoCD (and any helm-template-only renderer) must use, and the
# existingSecretKeys overrides for a Secret that doesn't use the chart's
# default key names.
baseUrl: https://rallly.example.com
supportEmail: admin@example.com

existingSecret: rallly-app
existingSecretKeys:
  secretPassword: app-secret-password
  cronSecret: app-cron-secret

postgresql:
  existingSecret: rallly-postgresql
  existingSecretKeys:
    username: db-username
    password: db-password
    database: db-name

garage:
  existingSecret: rallly-garage
  existingSecretKeys:
    rpcSecret: garage-rpc-secret
    accessKeyId: garage-access-key
    secretAccessKey: garage-secret-key
