## @section Global

global:
  # -- Default StorageClass for all bundled volumes (Postgres data, Garage meta/data). "" uses the cluster default. "-" disables dynamic provisioning (storageClassName: ""). Overridable per-volume below.
  storageClass: ""
  # -- Global override for all image registries below.
  imageRegistry: ""
  # -- Global list of imagePullSecrets, merged with image-specific ones.
  imagePullSecrets: []

## @section Rallly application

# -- Number of Rallly pods. Rate limiting is in-memory per pod unless `extraEnv` sets KV_REST_API_URL/KV_REST_API_TOKEN (Upstash Redis) — see kv.md in README.
replicaCount: 1

image:
  # -- Image registry
  registry: docker.io
  # -- Image repository
  repository: lukevella/rallly
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image pull secrets
  pullSecrets: []

# -- (required) Full public URL Rallly builds links against, e.g. https://rallly.example.com. Must include scheme and match the Ingress host.
baseUrl: ""

# -- (required) Email address shown to users for support inquiries. Also the fallback sender address.
supportEmail: ""

# -- Sender address for system emails. Falls back to supportEmail if unset.
noreplyEmail: ""

# -- Session encryption key, min 32 chars. Required unless existingSecret is set — generate one with: openssl rand -base64 32. Changing it invalidates all sessions.
secretPassword: ""

# -- Name of an existing Secret supplying the app credentials, instead of secretPassword/housekeeping.cronSecret. Set exactly one of secretPassword or existingSecret, never both. When set, the chart renders no app Secret and reads all app-level keys from it: SECRET_PASSWORD, CRON_SECRET (if housekeeping enabled), and optionally SMTP_PWD / OIDC_CLIENT_SECRET. See README.
existingSecret: ""

# -- Key names to read within existingSecret, if your Secret doesn't use the chart's default names. Only relevant when existingSecret is set.
existingSecretKeys:
  # -- Key holding the session encryption key.
  secretPassword: SECRET_PASSWORD
  # -- Key holding the housekeeping bearer token.
  cronSecret: CRON_SECRET
  # -- Key holding the SMTP password.
  smtpPassword: SMTP_PWD
  # -- Key holding the OIDC client secret.
  oidcClientSecret: OIDC_CLIENT_SECRET

# -- Comma-separated list of allowed email addresses/wildcards, e.g. "*@example.com". Empty allows all.
allowedEmails: ""

# -- Email of the first user allowed to claim admin at /control-panel.
initialAdminEmail: ""

emailLogin:
  # -- Enable magic-link email login. Set to false to enforce SSO-only login.
  enabled: true

registration:
  # -- Allow new user registration.
  enabled: true

## @section SMTP

smtp:
  # -- SMTP server host.
  host: ""
  # -- SMTP server port.
  port: 587
  # -- Use implicit TLS. true only for port 465; leave false for STARTTLS (587) or plain (25).
  secure: false
  # -- SMTP username.
  user: ""
  # -- SMTP password. Stored in the app Secret.
  password: ""
  # -- Reject self-signed/invalid SMTP TLS certificates.
  rejectUnauthorized: true

## @section Single sign-on (OIDC)

oidc:
  # -- Enable OIDC single sign-on.
  enabled: false
  # -- Display name for the OIDC login button.
  name: "OpenID Connect"
  # -- OIDC discovery URL (.well-known/openid-configuration).
  discoveryUrl: ""
  # -- OIDC client ID.
  clientId: ""
  # -- OIDC client secret. Stored in the app Secret.
  clientSecret: ""

## @section Database

postgresql:
  # -- Deploy a bundled PostgreSQL StatefulSet. Set to false to use an external database via `externalDatabase`.
  enabled: true
  image:
    # -- PostgreSQL image registry
    registry: docker.io
    # -- PostgreSQL image repository
    repository: library/postgres
    # -- PostgreSQL image tag. 18 moved PGDATA to /var/lib/postgresql — see dataMountPath.
    tag: "18-alpine"
  # -- Database username.
  username: rallly
  # -- Database password. Required unless postgresql.existingSecret is set — generate one with: openssl rand -base64 32.
  password: ""
  # -- Database name.
  database: rallly
  # -- Name of an existing Secret supplying the bundled Postgres credentials, instead of postgresql.password. Set exactly one of postgresql.password or postgresql.existingSecret, never both. When set, the chart renders no Postgres Secret and reads keys POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB from it. See README.
  existingSecret: ""
  # -- Key names to read within postgresql.existingSecret, if your Secret doesn't use the chart's default names. Only relevant when postgresql.existingSecret is set.
  existingSecretKeys:
    # -- Key holding the database username.
    username: POSTGRES_USER
    # -- Key holding the database password.
    password: POSTGRES_PASSWORD
    # -- Key holding the database name.
    database: POSTGRES_DB
  # -- Path the data volume is mounted at. postgres:18+ requires /var/lib/postgresql; older majors need /var/lib/postgresql/data.
  dataMountPath: /var/lib/postgresql
  persistence:
    # -- Use a PersistentVolumeClaim for Postgres data. Disabling loses all data on pod restart.
    enabled: true
    # -- StorageClass override for this volume. Falls back to global.storageClass, then the cluster default.
    storageClass: ""
    # -- Size of the Postgres data volume.
    size: 8Gi
    # -- Access modes for the Postgres data volume.
    accessModes:
      - ReadWriteOnce
    # -- Use an existing PVC instead of a volumeClaimTemplate. Skips provisioning.
    existingClaim: ""
    # -- Extra annotations for the PVC.
    annotations: {}
  resources:
    # -- Resource limits for the Postgres container.
    limits:
      cpu: "2"
      memory: 2Gi
    # -- Resource requests for the Postgres container.
    requests:
      cpu: 250m
      memory: 512Mi

# -- Full postgres:// connection URL. Used only when postgresql.enabled is false.
externalDatabase:
  url: ""
  # -- Name of an existing Secret containing the DATABASE_URL key, instead of a plain-text url.
  existingSecret: ""
  # -- Key within existingSecret holding the connection URL.
  existingSecretKey: "DATABASE_URL"

## @section Object storage (S3-compatible)

garage:
  # -- Deploy a bundled single-node Garage StatefulSet for S3-compatible object storage. Set to false to use `externalS3`.
  enabled: true
  image:
    # -- Garage image registry
    registry: docker.io
    # -- Garage image repository
    repository: dxflrs/garage
    # -- Garage image tag
    tag: "v2.3.0"
  # -- Garage inter-node RPC secret: 64 lowercase hex characters (32 bytes). Required, along with accessKeyId and secretAccessKey, unless garage.existingSecret is set — generate one with: openssl rand -hex 32.
  rpcSecret: ""
  # -- Garage/S3 access key. Required, along with rpcSecret and secretAccessKey, unless garage.existingSecret is set.
  accessKeyId: ""
  # -- Garage/S3 secret key. Required, along with rpcSecret and accessKeyId, unless garage.existingSecret is set.
  secretAccessKey: ""
  # -- Default bucket created and used for uploads.
  bucketName: rallly
  # -- Name of an existing Secret supplying the bundled Garage credentials, instead of rpcSecret/accessKeyId/secretAccessKey. Set exactly one of those three or garage.existingSecret, never both. When set, the chart renders no Garage Secret and reads keys GARAGE_RPC_SECRET / GARAGE_DEFAULT_ACCESS_KEY / GARAGE_DEFAULT_SECRET_KEY from it. See README.
  existingSecret: ""
  # -- Key names to read within garage.existingSecret, if your Secret doesn't use the chart's default names. Only relevant when garage.existingSecret is set.
  existingSecretKeys:
    # -- Key holding the Garage inter-node RPC secret.
    rpcSecret: GARAGE_RPC_SECRET
    # -- Key holding the Garage/S3 access key.
    accessKeyId: GARAGE_DEFAULT_ACCESS_KEY
    # -- Key holding the Garage/S3 secret key.
    secretAccessKey: GARAGE_DEFAULT_SECRET_KEY
  persistence:
    meta:
      # -- StorageClass for the Garage metadata volume.
      storageClass: ""
      # -- Size of the Garage metadata volume.
      size: 1Gi
      # -- Access modes for the Garage metadata volume.
      accessModes:
        - ReadWriteOnce
    data:
      # -- StorageClass for the Garage data volume.
      storageClass: ""
      # -- Size of the Garage data volume.
      size: 10Gi
      # -- Access modes for the Garage data volume.
      accessModes:
        - ReadWriteOnce
  resources:
    # -- Resource limits for the Garage container.
    limits:
      cpu: "1"
      memory: 512Mi
    # -- Resource requests for the Garage container.
    requests:
      cpu: 100m
      memory: 128Mi

# -- S3 endpoint URL, e.g. https://s3.amazonaws.com or https://<account>.r2.cloudflarestorage.com. Used only when garage.enabled is false.
externalS3:
  endpoint: ""
  # -- S3 bucket name.
  bucketName: ""
  # -- S3 region.
  region: ""
  # -- S3 access key ID.
  accessKeyId: ""
  # -- S3 secret access key. Stored in the app Secret.
  secretAccessKey: ""
  # -- Name of an existing Secret containing S3 credentials, instead of plain-text keys.
  existingSecret: ""
  # -- Key names to read within externalS3.existingSecret, if your Secret doesn't use the chart's default names. Only relevant when externalS3.existingSecret is set.
  existingSecretKeys:
    # -- Key holding the S3 access key ID.
    accessKeyId: S3_ACCESS_KEY_ID
    # -- Key holding the S3 secret access key.
    secretAccessKey: S3_SECRET_ACCESS_KEY

## @section Housekeeping

housekeeping:
  # -- Run scheduled housekeeping CronJobs (auto-close polls, delete inactive/soft-deleted polls and users). These tasks DELETE data on a retention schedule — review `housekeeping.tasks` before enabling on data you want to keep indefinitely.
  enabled: true
  # -- Bearer token required by /api/house-keeping/* endpoints. Required unless existingSecret is set — generate one with: openssl rand -base64 32.
  cronSecret: ""
  image:
    # -- curl image registry used to call the housekeeping endpoints.
    registry: docker.io
    # -- curl image repository.
    repository: curlimages/curl
    # -- curl image tag.
    tag: "8.11.1"
  # -- List of {name, schedule} housekeeping tasks. Schedules are UTC cron expressions, matching rallly.co's own schedule.
  tasks:
    - name: auto-close-polls
      schedule: "30 5 * * *"
    - name: delete-inactive-polls
      schedule: "0 6 * * *"
    - name: remove-deleted-polls
      schedule: "30 6 * * *"
    - name: remove-deleted-users
      schedule: "0 7 * * *"

## @section Migration job

migrationJob:
  # -- Run `prisma migrate deploy` as a pre-upgrade Helm hook. The app image always migrates on its own at startup under an advisory lock; this only makes a broken migration fail the upgrade before pods roll, instead of crashlooping app pods.
  enabled: false
  # -- Number of retries for the migration Job before it is considered failed.
  backoffLimit: 2

## @section Networking

service:
  # -- Kubernetes Service type for the app.
  type: ClusterIP
  # -- Service port.
  port: 80

ingress:
  # -- Create an Ingress for the app.
  enabled: false
  # -- IngressClass to use.
  className: ""
  # -- Extra annotations for the Ingress, e.g. cert-manager.io/cluster-issuer.
  annotations: {}
  # -- Hostname to route to the app. Should match the host portion of `baseUrl`.
  host: ""
  # -- Enable TLS on the Ingress.
  tls:
    enabled: false
    # -- Name of the TLS Secret. Leave empty if using cert-manager to provision it.
    secretName: ""

## @section Probes

probes:
  startup:
    # -- Startup probe failure threshold. Combined with periodSeconds, this must budget enough time for `prisma migrate deploy` to complete on first boot.
    failureThreshold: 30
    # -- Startup probe period.
    periodSeconds: 10
  liveness:
    # -- Liveness probe initial delay.
    initialDelaySeconds: 0
    # -- Liveness probe period.
    periodSeconds: 10
  readiness:
    # -- Readiness probe initial delay.
    initialDelaySeconds: 0
    # -- Readiness probe period.
    periodSeconds: 5

## @section Pod scheduling and security

# -- Resource requests/limits for the app container.
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

podSecurityContext:
  # -- Pod-level fsGroup. Matches the image's built-in `nodejs` group (verified via `docker run --rm --entrypoint id lukevella/rallly:4`).
  fsGroup: 101
  # -- Require the pod to run as non-root.
  runAsNonRoot: true
  # -- UID to run as. Matches the image's built-in `nextjs` user.
  runAsUser: 100

containerSecurityContext:
  # -- Disallow privilege escalation.
  allowPrivilegeEscalation: false
  capabilities:
    # -- Linux capabilities to drop.
    drop:
      - ALL
  # -- Mount the root filesystem read-only. Left false: the Next.js standalone server writes to .next/cache at runtime.
  readOnlyRootFilesystem: false

# -- Node selector for the app pods.
nodeSelector: {}
# -- Tolerations for the app pods.
tolerations: []
# -- Affinity rules for the app pods.
affinity: {}
# -- Topology spread constraints for the app pods.
topologySpreadConstraints: []
# -- Priority class for the app pods.
priorityClassName: ""
# -- Extra labels for the app pods.
podLabels: {}
# -- Extra annotations for the app pods.
podAnnotations: {}

serviceAccount:
  # -- Create a ServiceAccount for the app.
  create: true
  # -- Name of the ServiceAccount to use. Generated from the release name if not set.
  name: ""
  # -- Extra annotations for the ServiceAccount.
  annotations: {}

# -- Extra environment variables for the app container, e.g. KV_REST_API_URL/KV_REST_API_TOKEN, branding vars, MODERATION_*, NEXT_PUBLIC_CDN_BASE_URL. Accepts the full corev1 EnvVar schema.
extraEnv: []

# -- Extra volumes for the app pod.
extraVolumes: []
# -- Extra volume mounts for the app container.
extraVolumeMounts: []

caCert:
  # -- Mount a custom root CA certificate and set NODE_EXTRA_CA_CERTS, for networks that intercept TLS with a corporate root CA.
  enabled: false
  # -- Name of an existing Secret containing the CA certificate.
  secretName: ""
  # -- Key within the Secret holding the PEM-encoded certificate.
  secretKey: "ca.crt"

## @section Autoscaling (disabled by default)

autoscaling:
  # -- Enable a HorizontalPodAutoscaler for the app. Note: rate limiting is in-memory per pod — set extraEnv KV_REST_API_URL/KV_REST_API_TOKEN (Upstash Redis) before scaling beyond 1 replica in production.
  enabled: false
  # -- Minimum replica count.
  minReplicas: 1
  # -- Maximum replica count.
  maxReplicas: 5
  # -- Target average CPU utilization.
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization.
  targetMemoryUtilizationPercentage: ""

## @section Pod disruption budget (disabled by default)

podDisruptionBudget:
  # -- Create a PodDisruptionBudget for the app. Only useful with replicaCount/autoscaling.minReplicas >= 2.
  enabled: false
  # -- Minimum available pods during a voluntary disruption.
  minAvailable: 1

## @section Network policy (disabled by default)

networkPolicy:
  # -- Create NetworkPolicies restricting traffic to the app, Postgres and Garage.
  enabled: false
  # -- Namespace selector allowed to reach the app on its Service port, e.g. an ingress-controller namespace. Empty allows from anywhere in the cluster.
  ingressNamespaceSelector: {}
  # -- Allow all egress from app pods (needed for SMTP/external S3/OIDC to arbitrary hosts). Disable and use extraEgressRules to lock this down further.
  allowExternalEgress: true

# -- Extra raw Kubernetes manifests to install alongside the chart.
extraManifests: []
