{{- if and .Values.garage.enabled (not .Values.garage.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rallly.garage.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rallly.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
type: Opaque
stringData:
  GARAGE_RPC_SECRET: {{ .Values.garage.rpcSecret | quote }}
  GARAGE_DEFAULT_ACCESS_KEY: {{ .Values.garage.accessKeyId | quote }}
  GARAGE_DEFAULT_SECRET_KEY: {{ .Values.garage.secretAccessKey | quote }}
{{- end }}
